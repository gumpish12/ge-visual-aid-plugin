plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// THE RUNELITE VERSION IS DYNAMIC, AND THAT IS A STANDING HAZARD.
// `latest.release` means every RuneLite release is picked up without anyone
// choosing it, and `gradlew run` is what LAUNCHES the client - so a release
// that changes an API signature does not degrade the plugin, it stops
// RuneLite starting at all. 1.13.0 widened the Grand Exchange price types
// from int to long and did exactly that on 2026-09-27.
//
// The override is the escape hatch, so a broken release costs one flag
// rather than an edit to a tracked file on three machines:
//     gradlew run -PruneliteVersion=1.12.39
// Leave it unset for normal running.
def runeLiteVersion = (project.findProperty('runeliteVersion') ?: 'latest.release').toString()
println "RuneLite dependency: ${runeLiteVersion}"
def pluginMainClass = 'com.ge.gevisualaid.GEVisualAidTest'

// GRADLE CACHES A DYNAMIC VERSION FOR 24 HOURS, SO `latest.release` MEANS
// "yesterday's release" FOR MOST OF A DAY AFTER ONE SHIPS - and on 2026-09-30
// that was the whole bug. The RuneLite plugin hub is keyed on the CLIENT
// VERSION: repo.runelite.net serves a different manifest, and a different
// jar, for 1.13.0 than for 1.13.1. A dev client still resolving 1.13.0 loaded
// a two-day-old Flipping Copilot beside a game update that had moved the GE
// interface, so it suggested prices and highlighted nothing, on three VMs,
// with no error on any of them.
//
// Ten minutes is short enough that a restart picks a release up and long
// enough that a build is not a network round trip. It does NOT make the
// version deterministic - use -PruneliteVersion=x.y.z for that.
configurations.all {
	resolutionStrategy.cacheDynamicVersionsFor 10, 'minutes'
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.ge.gevisualaid'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug", "--insecure-skip-tls-verification"

	doFirst {
		println "Launching RuneLite with credentials from: " +
				"${System.getProperty('user.home')}\\.runelite\\credentials.properties"
	}
}

// Item J (2.86): runs src/test/.../MlmCheck.java, which exercises the REAL
// compiled motherlode helpers by reflection rather than a copy of them - a
// checker that re-implements what it checks passes for the same reason the
// code fails. Proved red by deliberately breaking the tile key packing, the
// vein id list and the version string, one at a time.
tasks.register('mlmCheck', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.ge.gevisualaid.MlmCheck'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
